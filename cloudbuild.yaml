# CyPh Subscription Portal v1 — generated by next-deploy-auto v1.3 from stark-deploy.yaml
# Template 2B (no build-time secrets). Access: PUBLIC (access.invoker: public).
# Dynamic env access: none found at generation -> public vars ride build ARGs only.
# Secrets: none (secrets.items is empty) -> no --set-secrets.
substitutions:
  _REGION: "us-east1"
  _SERVICE_NAME: "cyph-sub-portal-prod"
  _NEXT_PUBLIC_APP_URL: "INVALID://SET-IN-DEPLOY-SH"
  _NEXT_PUBLIC_SUPABASE_URL: "INVALID://SET-IN-DEPLOY-SH"
  _NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "INVALID://SET-IN-DEPLOY-SH"
  _NEXT_PUBLIC_SITE_URL: "INVALID://SET-IN-DEPLOY-SH"
  # INVALID:// defaults fail loudly if deploy.sh ever misses a substitution.

steps:
  # 1. Build Docker Image (no secrets at build time)
  - name: "gcr.io/cloud-builders/docker"
    id: "Build Image"
    args:
      - "build"
      - "--build-arg"
      - "NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}"
      - "--build-arg"
      - "NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}"
      - "--build-arg"
      - "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
      - "--build-arg"
      - "NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE_NAME}:latest"
      - "."

  # 2. Push to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    id: "Push Image"
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE_NAME}:latest"]

  # 3. Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    id: "Deploy to Cloud Run"
    args:
      [
        "run", "deploy", "${_SERVICE_NAME}",
        "--image", "${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE_NAME}:latest",
        "--region", "${_REGION}",
        "--platform", "managed",
        "--allow-unauthenticated",
        "--service-account", "sa-cyph-sub-portal-runtime@$PROJECT_ID.iam.gserviceaccount.com",
        "--memory", "1Gi",
        "--max-instances", "1",
        "--min-instances", "0",
      ]
